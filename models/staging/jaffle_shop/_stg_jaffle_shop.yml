version: 2

models:
  - name: stg_jaffle_shop__customers
    description: >
      One record per customer from the `jaffle_shop.customers` source. This model
      renames the raw customer identifier to `customer_id` and keeps the customer's
      first and last name for downstream joins and marts.
    columns:
      - name: customer_id
        description: Primary key for this staging model. Derived from the raw customer `id`.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name from the source system.
      - name: last_name
        description: Customer last name from the source system.

  - name: stg_jaffle_shop__orders
    columns:
      - name: order_id
        description: primary key for the orders table
        data_tests:
          - unique
          - not_null
      - name: status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              values:
                - completed
                - shipped
                - returned
                - placed
                - return_pending
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id
